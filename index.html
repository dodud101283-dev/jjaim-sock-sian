<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>짜임 양말 시안</title>
<style>
  :root{
    --bg:#fff8f6; --card:#ffffff; --ink:#2b2326; --sub:#7a6a6f; --line:#f0dfe2;
    --pink:#ff6b8b; --pink-d:#e84a6f; --pink-l:#ffe3ea;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  main{max-width:560px; margin:0 auto; padding:16px 16px 40px}
  h1{font-size:22px; margin:8px 0 4px; letter-spacing:-.3px}
  .sub{margin:0 0 14px; color:var(--sub); font-size:14px}
  .stage{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:10px; position:relative}
  canvas{width:100%; height:auto; display:block; border-radius:14px; background:#fffdfc; touch-action:none; -webkit-user-select:none; user-select:none}
  .hint{position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(43,35,38,.78); color:#fff;
    font-size:12.5px; padding:6px 12px; border-radius:99px; pointer-events:none; transition:opacity .4s; white-space:nowrap}
  .hint.off{opacity:0}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0}
  button, .btn{appearance:none; border:0; border-radius:14px; font:inherit; font-weight:700; font-size:15px; padding:13px 16px; cursor:pointer;
    background:var(--pink); color:#fff; text-align:center}
  button.ghost,.btn.ghost{background:var(--pink-l); color:var(--pink-d)}
  button.line{background:#fff; color:var(--ink); border:1px solid var(--line)}
  button:active,.btn:active{transform:scale(.98)}
  .grow{flex:1}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 14px 6px; margin-top:12px}
  .panel h2{font-size:15px; margin:0 0 8px}
  .field{margin:10px 0}
  .field label{display:flex; justify-content:space-between; font-size:13px; color:var(--sub); margin-bottom:4px}
  input[type=range]{width:100%; accent-color:var(--pink)}
  .sw{display:flex; gap:10px; margin:6px 0 4px}
  .sw button{width:42px; height:42px; padding:0; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line)}
  .sw button.on{box-shadow:0 0 0 3px var(--pink)}
  .chk{display:flex; align-items:center; gap:8px; font-size:14px; margin:10px 0}
  .chk input{width:20px; height:20px; accent-color:var(--pink)}
  .ask button{display:block; width:100%; margin:8px 0}
  .thanks{padding:8px 2px 14px; font-weight:700}
  .note{color:var(--sub); font-size:12.5px; line-height:1.55; margin-top:16px}
  .note b{color:var(--ink)}
  [hidden]{display:none!important}
  input[type=file]{display:none}
</style>
</head>
<body>
<main>
  <h1>내 그림으로 양말 시안 만들기 🧦</h1>
  <p class="sub">그림을 올리고, 손가락으로 톡 눌러 보세요. 양말 위에서 그림이 움직여요.</p>

  <section class="stage">
    <canvas id="c" aria-label="양말 시안 미리보기"></canvas>
    <div class="hint" id="hint">그림을 올리면 여기에 나타나요</div>
  </section>

  <div class="row" id="step1">
    <label class="btn grow" for="file1">📷 내 그림 올리기 (JPG·PNG)</label>
    <button class="ghost grow" id="demoBtn" type="button">예시 그림으로 해 보기</button>
  </div>
  <input id="file1" type="file" accept="image/png,image/jpeg">
  <input id="file2" type="file" accept="image/png,image/jpeg">

  <section class="panel" id="tools" hidden>
    <h2>🎨 이렇게 해 보세요</h2>
    <div class="note" style="margin:0 0 6px">
      <b>톡</b> 누르면 그 자리로 · <b>끌면</b> 따라 움직여요 · <b>두 손가락</b>으로 키우고 돌려요
    </div>
    <div class="field">
      <label><span>크기</span><span id="sv">100%</span></label>
      <input id="size" type="range" min="20" max="300" value="100">
    </div>
    <div class="field">
      <label><span>돌리기</span><span id="rv">0°</span></label>
      <input id="rot" type="range" min="-180" max="180" value="0">
    </div>
    <div class="field">
      <label><span>양말 색</span></label>
      <div class="sw" id="sw"></div>
    </div>
    <label class="chk"><input type="checkbox" id="link" checked> 두 양말이 같이 움직이게</label>
    <div class="row">
      <button class="line" id="center" type="button">가운데로</button>
      <button class="line" id="reset" type="button">처음으로</button>
      <label class="btn line" for="file2" id="second">둘째 양말은 다른 그림</label>
    </div>
    <div class="row">
      <button class="ghost grow" id="save" type="button">🖼 시안 저장하기</button>
      <button class="grow" id="done" type="button">다 만들었어요</button>
    </div>
  </section>

  <section class="panel ask" id="ask" hidden>
    <h2 id="askQ"></h2>
    <div id="askBtns"></div>
    <div class="thanks" id="thanks" hidden></div>
  </section>

  <p class="note">
    <b>올린 그림은 이 폰 밖으로 나가지 않아요.</b> 저장도, 전송도 하지 않고 이 화면에서만 써요.<br>
    이 화면은 <b>시안 예시</b>예요. 실제 인쇄는 색·크기·위치가 조금 다를 수 있어요.
  </p>
</main>

<script>
/* ===== 설정 (만든 사람이 채우는 곳) ===========================================
   PRICE_TEXT      : 마지막 질문에 보일 제안가. 예) '커플 세트(2켤레) 29,000원'. 비워 두면 가격 문구 없이 물어요.
   ANSWER_ENDPOINT : 구글폼 「formResponse」 주소. 예) https://docs.google.com/forms/d/e/XXXX/formResponse
   ANSWER_ENTRY    : 그 폼의 「마지막 한 문항」 입력칸 이름. 예) entry.1234567890
   두 칸을 비워 두면 답은 어디에도 저장되지 않아요(시험용).
   ======================================================================== */
const CONFIG = { PRICE_TEXT: '', ANSWER_ENDPOINT: '', ANSWER_ENTRY: '' };

(() => {
  // ---- 그림판 크기(논리 좌표) ----
  const W = 700, H = 440;
  const SOCK_W = 300;
  const ORIGINS = [{x:36, y:14}, {x:364, y:14}];
  // 양말 한 짝(옆모습) 윤곽. 0..300 x 0..380
  const SOCK_PATH = 'M70,0 L190,0 L190,225 C190,245 205,252 225,256 C268,262 296,282 296,312 C296,342 272,356 240,356 L96,356 C70,356 54,340 54,314 C54,290 66,276 70,250 Z';
  const PRINT = {x:76, y:54, w:108, h:158, r:14};          // 인쇄 가능 영역(예시)
  const CENTER = {x: PRINT.x + PRINT.w/2, y: PRINT.y + PRINT.h/2};
  const COLORS = [
    {name:'흰색',   base:'#f7f5f2', accent:'#e7e2dc'},
    {name:'연핑크', base:'#fadbe2', accent:'#f2bccb'},
    {name:'하늘색', base:'#dbeaf7', accent:'#bad2ea'},
    {name:'연회색', base:'#e6e7ea', accent:'#c9cbd1'},
  ];

  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.aspectRatio = W + ' / ' + H;

  const newT = () => ({x: CENTER.x, y: CENTER.y, s: 1, r: 0});
  const state = {
    imgs: [null, null],           // 양말별 그림
    t: [newT(), newT()],
    sel: 0,
    color: 0,
    link: true,
    guide: true,
  };
  const sockPath = new Path2D(SOCK_PATH);

  // ---- 그리기 ----
  function rr(c, x, y, w, h, r){
    c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
  }
  function knitPattern(c){
    const p = document.createElement('canvas'); p.width = 6; p.height = 6;
    const q = p.getContext('2d');
    q.strokeStyle = 'rgba(0,0,0,.07)'; q.lineWidth = 1;
    q.beginPath(); q.moveTo(0,6); q.lineTo(6,0); q.stroke();
    q.beginPath(); q.moveTo(-1,1); q.lineTo(1,-1); q.stroke();
    q.beginPath(); q.moveTo(5,7); q.lineTo(7,5); q.stroke();
    return c.createPattern(p, 'repeat');
  }
  const pattern = knitPattern(ctx);

  function drawSock(c, i, forExport){
    const o = ORIGINS[i], col = COLORS[state.color], img = state.imgs[i], t = state.t[i];
    c.save(); c.translate(o.x, o.y);

    // 몸통
    c.fillStyle = col.base; c.fill(sockPath);
    c.save(); c.clip(sockPath);
    // 뒤꿈치·발끝·입구 포인트
    c.fillStyle = col.accent;
    c.beginPath(); c.ellipse(78, 322, 52, 62, 0, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(282, 316, 38, 54, 0, 0, Math.PI*2); c.fill();
    c.fillRect(60, 0, 140, 40);
    // 입구 골
    c.strokeStyle = 'rgba(0,0,0,.09)'; c.lineWidth = 1.2;
    for (let x = 74; x < 190; x += 7){ c.beginPath(); c.moveTo(x, 2); c.lineTo(x, 38); c.stroke(); }

    // 인쇄(곱하기: 흰 배경 JPG도 양말에 자연스럽게 섞임)
    if (img){
      c.save();
      rr(c, PRINT.x, PRINT.y, PRINT.w, PRINT.h, PRINT.r); c.clip();
      c.globalCompositeOperation = 'multiply';
      const base = Math.min(PRINT.w / img.width, PRINT.h / img.height);
      const w = img.width * base * t.s, h = img.height * base * t.s;
      c.translate(t.x, t.y); c.rotate(t.r * Math.PI / 180);
      c.drawImage(img, -w/2, -h/2, w, h);
      c.restore();
    }
    // 실 질감 + 입체감
    c.fillStyle = pattern; c.fill(sockPath);
    const g = c.createLinearGradient(54, 0, 296, 0);
    g.addColorStop(0, 'rgba(255,255,255,.28)'); g.addColorStop(.55, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.10)');
    c.fillStyle = g; c.fill(sockPath);
    c.restore();
    c.strokeStyle = 'rgba(60,40,48,.28)'; c.lineWidth = 1.6; c.stroke(sockPath);

    // 안내선(저장할 때는 숨김)
    if (!forExport && state.guide){
      c.save(); c.setLineDash([5,4]); c.lineWidth = 1.5;
      c.strokeStyle = i === state.sel ? 'rgba(232,74,111,.95)' : 'rgba(232,74,111,.35)';
      rr(c, PRINT.x, PRINT.y, PRINT.w, PRINT.h, PRINT.r); c.stroke(); c.restore();
      if (!img){
        c.fillStyle = 'rgba(232,74,111,.75)'; c.font = '600 11px sans-serif'; c.textAlign = 'center';
        c.fillText('인쇄 영역', CENTER.x, CENTER.y + 4);
      }
    }
    // 이름표
    c.fillStyle = (i === state.sel && !forExport) ? '#e84a6f' : '#8d7b81';
    c.font = ((i === state.sel && !forExport) ? '700 ' : '500 ') + '14px sans-serif'; c.textAlign = 'center';
    c.fillText('양말 ' + (i + 1), 150, 392);
    c.restore();
  }

  function render(c, forExport){
    c.clearRect(0, 0, W, H);
    c.fillStyle = '#fffdfc'; c.fillRect(0, 0, W, H);
    drawSock(c, 0, forExport); drawSock(c, 1, forExport);
  }
  let dirty = true;
  function paint(){ if (dirty){ ctx.setTransform(dpr,0,0,dpr,0,0); render(ctx, false); dirty = false; } requestAnimationFrame(paint); }
  const redraw = () => { dirty = true; };

  // ---- 입력(톡·끌기·두 손가락) ----
  function toLogical(e){
    const r = cv.getBoundingClientRect();
    return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
  }
  function sockAt(p){
    for (let i = 0; i < 2; i++){
      const o = ORIGINS[i];
      if (p.x >= o.x - 10 && p.x <= o.x + SOCK_W - 4) return i;
    }
    return null;
  }
  const ptrs = new Map();
  let gest = null;
  function sync(i){                                // 같이 움직이기
    if (state.link && state.imgs[0] && state.imgs[0] === state.imgs[1]){
      const j = 1 - i; state.t[j] = {...state.t[i]};
    }
  }
  function uiFromT(){
    const t = state.t[state.sel];
    $('size').value = Math.round(t.s * 100); $('sv').textContent = Math.round(t.s * 100) + '%';
    let d = Math.round(t.r); while (d > 180) d -= 360; while (d < -180) d += 360;
    $('rot').value = d; $('rv').textContent = d + '°';
  }
  const hasImg = () => !!(state.imgs[0] || state.imgs[1]);

  cv.addEventListener('pointerdown', e => {
    if (!hasImg()) return;
    cv.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, toLogical(e));
    const p = toLogical(e), hit = sockAt(p);
    if (ptrs.size === 1){
      const wasSel = (hit === state.sel);
      if (hit !== null && hit !== state.sel){ state.sel = hit; uiFromT(); redraw(); }
      gest = {mode:'one', start:p, moved:false, wasSel, sock:state.sel, t0:{...state.t[state.sel]}};
    } else if (ptrs.size === 2){
      const [a, b] = [...ptrs.values()];
      gest = {mode:'two', sock:state.sel, t0:{...state.t[state.sel]},
              d0:Math.hypot(b.x-a.x, b.y-a.y) || 1, a0:Math.atan2(b.y-a.y, b.x-a.x)};
    }
    showHint(false);
  });
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId) || !gest) return;
    ptrs.set(e.pointerId, toLogical(e));
    const t = state.t[gest.sock];
    if (gest.mode === 'one'){
      const p = ptrs.get(e.pointerId);
      const dx = p.x - gest.start.x, dy = p.y - gest.start.y;
      if (!gest.moved && Math.hypot(dx, dy) > 5) gest.moved = true;
      if (gest.moved){ t.x = gest.t0.x + dx; t.y = gest.t0.y + dy; clampT(t); sync(gest.sock); uiFromT(); redraw(); }
    } else if (gest.mode === 'two' && ptrs.size >= 2){
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(b.x-a.x, b.y-a.y) || 1, an = Math.atan2(b.y-a.y, b.x-a.x);
      t.s = Math.max(.2, Math.min(3, gest.t0.s * d / gest.d0));
      t.r = gest.t0.r + (an - gest.a0) * 180 / Math.PI;
      sync(gest.sock); uiFromT(); redraw();
    }
  });
  function endPtr(e){
    if (!ptrs.has(e.pointerId)) return;
    const g = gest;
    ptrs.delete(e.pointerId);
    if (g && g.mode === 'one' && !g.moved && g.wasSel && e.type === 'pointerup'){
      // 톡! — 눌린 곳으로 그림이 통통 이동
      const o = ORIGINS[g.sock], p = toLogical(e);
      tweenTo(g.sock, p.x - o.x, p.y - o.y);
    }
    if (ptrs.size === 0) gest = null;
    else if (ptrs.size === 1){ const only = [...ptrs.values()][0]; gest = {mode:'one', start:only, moved:true, wasSel:true, sock:state.sel, t0:{...state.t[state.sel]}}; }
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);

  function clampT(t){                               // 그림 중심이 인쇄 영역 밖으로 너무 멀리 못 가게
    t.x = Math.max(PRINT.x - 30, Math.min(PRINT.x + PRINT.w + 30, t.x));
    t.y = Math.max(PRINT.y - 30, Math.min(PRINT.y + PRINT.h + 30, t.y));
  }
  function tweenTo(i, x, y){
    const t = state.t[i], from = {x:t.x, y:t.y}, to = {x, y}; clampT(to);
    const t0 = performance.now(), dur = 220;
    (function step(now){
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      const over = k < 1 ? 0 : 0;
      t.x = from.x + (to.x - from.x) * e + over; t.y = from.y + (to.y - from.y) * e;
      sync(i); redraw();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  // ---- 그림 불러오기 ----
  function loadFile(file, cb){
    if (!file) return;
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(im.width, im.height));
      if (k < 1){                                   // 폰 메모리를 아끼려고 줄임
        const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c);
      } else cb(im);
      URL.revokeObjectURL(url);
    };
    im.onerror = () => { alert('그림을 열 수 없어요. JPG나 PNG 파일을 골라 주세요.'); URL.revokeObjectURL(url); };
    im.src = url;
  }
  function setBoth(img){
    state.imgs = [img, img]; state.t = [newT(), newT()]; state.link = true; $('link').checked = true;
    afterLoad();
  }
  function afterLoad(){
    $('tools').hidden = false; $('step1').querySelector('label').textContent = '📷 다른 그림 올리기';
    showHint(true, '톡 눌러 보세요 · 끌어도 돼요');
    uiFromT(); redraw(); setTimeout(() => showHint(false), 4200);
  }
  $('file1').addEventListener('change', e => { loadFile(e.target.files[0], setBoth); e.target.value = ''; });
  $('file2').addEventListener('change', e => {
    loadFile(e.target.files[0], img => {
      if (!state.imgs[0]) state.imgs[0] = img;
      state.imgs[1] = img; state.t[1] = newT(); state.link = false; $('link').checked = false;
      state.sel = 1; afterLoad();
    });
    e.target.value = '';
  });

  // 예시 그림(그림 없이 체험)
  function sampleImage(){
    const c = document.createElement('canvas'); c.width = c.height = 800;
    const q = c.getContext('2d');
    q.fillStyle = '#fff'; q.fillRect(0, 0, 800, 800);
    q.fillStyle = '#ff6b8b'; q.beginPath(); q.moveTo(400, 640);
    q.bezierCurveTo(120, 430, 170, 190, 330, 220); q.bezierCurveTo(380, 230, 400, 270, 400, 290);
    q.bezierCurveTo(400, 270, 420, 230, 470, 220); q.bezierCurveTo(630, 190, 680, 430, 400, 640); q.fill();
    q.fillStyle = '#fff'; q.font = '700 78px sans-serif'; q.textAlign = 'center'; q.fillText('우리 100일', 400, 420);
    q.fillStyle = '#7a6a6f'; q.font = '700 70px sans-serif'; q.fillText('2026.11.23', 400, 745);
    return c;
  }
  $('demoBtn').addEventListener('click', () => setBoth(sampleImage()));

  // ---- 도구 ----
  $('size').addEventListener('input', e => { const t = state.t[state.sel]; t.s = e.target.value / 100; sync(state.sel); uiFromT(); redraw(); });
  $('rot').addEventListener('input', e => { const t = state.t[state.sel]; t.r = +e.target.value; sync(state.sel); uiFromT(); redraw(); });
  $('center').addEventListener('click', () => tweenTo(state.sel, CENTER.x, CENTER.y));
  $('reset').addEventListener('click', () => { state.t[state.sel] = newT(); sync(state.sel); uiFromT(); redraw(); });
  $('link').addEventListener('change', e => { state.link = e.target.checked; if (state.link){ sync(state.sel); redraw(); } });
  const sw = $('sw');
  COLORS.forEach((c, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.title = c.name; b.setAttribute('aria-label', c.name);
    b.style.background = c.base; if (i === state.color) b.className = 'on';
    b.addEventListener('click', () => { state.color = i; [...sw.children].forEach((x, j) => x.className = j === i ? 'on' : ''); redraw(); });
    sw.appendChild(b);
  });

  // ---- 저장(안내선 없이 + 「시안 예시」 문구) ----
  $('save').addEventListener('click', () => {
    const out = document.createElement('canvas'); out.width = W * 2; out.height = (H + 36) * 2;
    const c = out.getContext('2d'); c.scale(2, 2);
    c.fillStyle = '#fffdfc'; c.fillRect(0, 0, W, H + 36);
    render(c, true);
    c.fillStyle = '#8d7b81'; c.font = '500 12px sans-serif'; c.textAlign = 'center';
    c.fillText('짜임 · 시안 예시예요. 실제 인쇄는 색·크기·위치가 조금 다를 수 있어요.', W / 2, H + 22);
    out.toBlob(async blob => {
      const file = new File([blob], '짜임_양말시안.png', {type: 'image/png'});
      try {
        if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: '짜임 양말 시안'}); return; }
      } catch (_) { /* 공유 취소 */ return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '짜임_양말시안.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  });

  // ---- 마지막 한 문항 ----
  const ANSWERS = ['꼭 살 것 같다', '아마 살 것 같다', '모르겠다', '안 살 것 같다'];
  $('done').addEventListener('click', () => {
    $('ask').hidden = false; $('askQ').textContent = '이 시안이 실제 양말로 집에 온다면, 사시겠어요?' + (CONFIG.PRICE_TEXT ? ' (' + CONFIG.PRICE_TEXT + ')' : '');
    const box = $('askBtns'); box.innerHTML = ''; $('thanks').hidden = true;
    ANSWERS.forEach(a => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'line'; b.textContent = a;
      b.addEventListener('click', () => answer(a)); box.appendChild(b);
    });
    $('ask').scrollIntoView({behavior: 'smooth', block: 'center'});
  });
  function answer(a){
    $('askBtns').innerHTML = ''; $('thanks').hidden = false;
    $('thanks').textContent = '답해 주셔서 감사합니다! 🧦 (' + a + ')';
    if (CONFIG.ANSWER_ENDPOINT && CONFIG.ANSWER_ENTRY){
      const fd = new FormData(); fd.append(CONFIG.ANSWER_ENTRY, a);
      fetch(CONFIG.ANSWER_ENDPOINT, {method: 'POST', mode: 'no-cors', body: fd}).catch(() => {});
    }
  }

  // ---- 안내 말풍선 ----
  const hint = $('hint'); let hintTimer;
  function showHint(on, text){ if (text) hint.textContent = text; hint.classList.toggle('off', !on); }

  // 시험용: 주소 뒤에 #demo 를 붙이면 예시 그림이 바로 뜸
  if (location.hash === '#demo'){ setBoth(sampleImage()); window.__state = state; }
  requestAnimationFrame(paint);
})();
</script>
</body>
</html>
